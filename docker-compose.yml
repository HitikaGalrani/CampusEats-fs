version: '3.8'

services:
  mongodb:
    image: mongo:latest
    container_name: campuseats-mongodb
    restart: always
    ports:
      - '27017:27017'
    environment:
      - MONGO_INITDB_DATABASE=campuseats
    volumes:
      - mongo-data:/data/db

  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: campuseats-backend
    restart: always
    ports:
      - '5000:5000'
    environment:
      - PORT=5000
      - MONGODB_URI=mongodb://mongodb:27017/campuseats
      - JWT_SECRET=campuseats_docker_secret_key_2026
      - NODE_ENV=production
    depends_on:
      - mongodb

  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: campuseats-frontend
    restart: always
    ports:
      - '5173:80'
    depends_on:
      - backend

volumes:
  mongo-data:
